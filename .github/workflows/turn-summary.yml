name: TSP checks
on:
  pull_request:
    paths: ['plugins/dsh-turn-summary/**', '.github/workflows/turn-summary.yml']
  push:
    paths: ['plugins/dsh-turn-summary/**', '.github/workflows/turn-summary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dsh-turn-summary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
